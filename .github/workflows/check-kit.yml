name: check-kit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: CLI syntax check
        run: node --check packages/ai-context-kit/bin/ai-context-kit.mjs
      - name: Plugin skill mirrors in sync
        run: ./scripts/sync-plugin-skills.sh --check
      - name: Kit integrity and CLI behavior checks
        run: ./scripts/check-kit.sh
      - name: Whitespace errors
        run: git diff --check
