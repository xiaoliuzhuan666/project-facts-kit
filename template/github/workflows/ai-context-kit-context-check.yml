name: AI Context Report

on:
  pull_request:
  workflow_dispatch:

jobs:
  context-report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # expected ai-context-kit version: 0.3.60
      # npm 上的 ai-context-kit 包名被无关第三方占用，CLI 只能从 GitHub 源码安装。
      PROJECT_FACTS_KIT_REPO: https://github.com/xiaoliuzhuan666/project-facts-kit.git
      PROJECT_FACTS_KIT_BRANCH: ${{ vars.PROJECT_FACTS_KIT_BRANCH || 'main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ai-context-kit
        run: |
          git clone --depth 1 --branch "$PROJECT_FACTS_KIT_BRANCH" "$PROJECT_FACTS_KIT_REPO" /tmp/project-facts-kit
          npm install --global /tmp/project-facts-kit/packages/ai-context-kit

      - name: Print ai-context-kit version
        run: ai-context-kit --version

      - name: Inspect workspace without writes
        run: ai-context-kit inspect --workspace . --json > /tmp/ai-context-inspect.json

      - name: Report workflow and capability status
        run: ai-context-kit doctor --workspace . > /tmp/ai-context-doctor.md

      - name: Report token visibility
        run: ai-context-kit token-status --workspace . --json --output /tmp/ai-context-token-status.json

      - name: Upload context reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-context-reports
          path: |
            /tmp/ai-context-inspect.json
            /tmp/ai-context-doctor.md
            /tmp/ai-context-token-status.json
          if-no-files-found: ignore
